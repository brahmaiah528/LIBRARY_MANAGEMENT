# ═══════════════════════════════════════════════════════════════
# Library Management System — Docker Compose (Development)
#
# Usage:
#   docker compose up --pull always          # Start all services (dev)
#   docker compose down -v                   # Stop & remove volumes
#   docker compose logs -f server            # Tail server logs
#   docker compose exec server sh            # Shell into server container
#
# Production:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up
# ═══════════════════════════════════════════════════════════════


services:

  # ── MongoDB ─────────────────────────────────────────────────
  mongodb:
    image: mongo:7-jammy
    container_name: lms_mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"          # Expose for local GUI tools (Compass, etc.)
    volumes:
      - mongo_data:/data/db    # Persist data across restarts
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:-root}
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - lms_network

  # ── Express API Server ───────────────────────────────────────
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
      target: development       # Switch to 'production' for prod builds
    container_name: lms_server
    restart: unless-stopped
    depends_on:
      mongodb:
        condition: service_healthy
    ports:
      - "5000:5000"
    environment:
      NODE_ENV: development
      PORT: 5000
      MONGO_URI: mongodb://root:${MONGO_PASSWORD:-root}@mongodb:27017/library_management?authSource=admin
      JWT_SECRET: ${JWT_SECRET:-supersecret_library_jwt_key_2026}
      FINE_PER_DAY: ${FINE_PER_DAY:-5}
    volumes:
      # Mount source for hot-reload in dev (remove for production)
      - ./server:/app
      # Preserve container's node_modules (don't sync from host)
      - /app/node_modules
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:5000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - lms_network

  # ── React / Vite Client ──────────────────────────────────────
  client:
    build:
      context: ./client
      dockerfile: Dockerfile
      target: development       # Switch to 'production' for prod builds
    container_name: lms_client
    restart: unless-stopped
    depends_on:
      server:
        condition: service_healthy
    ports:
      - "9999:3000"
    environment:
      NODE_ENV: development
      # Vite proxy in development
      VITE_API_URL: http://server:5000
    volumes:
      # Mount source for hot-reload in dev (remove for production)
      - ./client:/app
      # Preserve container's node_modules
      - /app/node_modules
    networks:
      - lms_network

# ── Named Volumes ────────────────────────────────────────────
volumes:
  mongo_data:
    driver: local

# ── Networks ─────────────────────────────────────────────────
networks:
  lms_network:
    driver: bridge
